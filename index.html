
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบสแกน QR นักเรียน</title>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      margin: 0;
      padding: 10px;
      text-align: center;
    }

    .card {
      background: white;
      max-width: 430px;
      margin: 10px auto;
      padding: 15px;
      border-radius: 18px;
      box-shadow: 0 4px 18px #0001;
    }

    h2 {
      color: #263b63;
      font-size: 20px;
    }

    #reader {
      width: 100%;
      max-width: 360px;
      aspect-ratio: 1 / 1;
      margin: 12px auto;
      overflow: hidden;
      border-radius: 12px;
    }

    #status {
      color: #475569;
      line-height: 1.6;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      margin: 7px 0;
    }

    button:disabled {
      opacity: .5;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>📷 สแกน QR Code นักเรียน</h2>
    <p>นำ QR Code ของนักเรียนมาไว้ในกรอบ</p>

    <div id="reader"></div>

    <button id="startBtn" onclick="startCamera()"
      style="display:none">
      📷 แตะเพื่อเริ่มกล้อง
    </button>

    <p id="status">กำลังเตรียมกล้อง...</p>
  </div>

<script>
  let scanner = null;
  let running = false;
  let processing = false;

  const statusText = document.getElementById('status');
  const startBtn = document.getElementById('startBtn');

  async function startCamera() {
    if (running || processing) return;

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      statusText.textContent =
        'เบราว์เซอร์ไม่รองรับกล้อง กรุณาเปิดผ่าน HTTPS';
      return;
    }

    processing = true;
    startBtn.disabled = true;
    statusText.textContent = 'กำลังขออนุญาตใช้กล้อง...';

    try {
      if (!scanner) {
        scanner = new Html5Qrcode('reader');
      }

      await scanner.start(
        { facingMode: 'environment' },
        {
          fps: 10,
          aspectRatio: 1,
          qrbox: function(width, height) {
            const size = Math.floor(
              Math.min(width, height) * 0.72
            );
            return { width: size, height: size };
          }
        },
        async function(decodedText) {
          if (!running || processing) return;

          processing = true;
          running = false;

          statusText.textContent =
            'อ่าน QR สำเร็จ กำลังส่งข้อมูล...';

          try {
            await scanner.stop();
          } catch (e) {}

          // ส่งรหัสกลับไปยังหน้าเว็บแอปที่ฝัง iframe นี้
          window.parent.postMessage({
            type: 'QR_SCANNED',
            code: decodedText
          }, 'https://script.google.com');

          statusText.textContent =
            'สแกนสำเร็จ กำลังบันทึกข้อมูล';

          startBtn.style.display = 'none';
        },
        function() {}
      );

      running = true;
      statusText.textContent =
        'เปิดกล้องแล้ว กรุณาสแกน QR Code';

      startBtn.style.display = 'none';

    } catch (error) {
      console.error(error);

      statusText.textContent =
        'ไม่สามารถเปิดกล้องอัตโนมัติได้ กรุณากดปุ่มเริ่มกล้อง';

      startBtn.style.display = 'block';
    } finally {
      processing = false;
      startBtn.disabled = false;
    }
  }

  async function stopCamera() {
    if (scanner && running) {
      try {
        await scanner.stop();
      } catch (e) {}
    }

    running = false;
    statusText.textContent = 'หยุดกล้องแล้ว';
  }

  // พยายามเปิดกล้องเมื่อหน้า iframe โหลดเสร็จ
  window.addEventListener('load', function() {
    startCamera();
  });

  // เมื่อหน้าเว็บแอปแจ้งให้หยุดกล้อง
  window.addEventListener('message', function(event) {
    if (event.data && event.data.type === 'STOP_CAMERA') {
      stopCamera();
    }
  });
</script>
</body>
</html>
