
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สแกน QR Code นักเรียน</title>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      margin: 0;
      padding: 10px;
      text-align: center;
    }

    .card {
      background: white;
      max-width: 430px;
      margin: 10px auto;
      padding: 16px;
      border-radius: 18px;
      box-shadow: 0 4px 18px #0001;
    }

    h2 {
      color: #263b63;
      font-size: 20px;
    }

    #reader {
      width: 100%;
      max-width: 360px;
      aspect-ratio: 1 / 1;
      margin: 12px auto;
      overflow: hidden;
      border-radius: 12px;
    }

    #status {
      color: #475569;
      line-height: 1.6;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      margin: 7px 0;
    }

    button:disabled {
      opacity: .5;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>📷 สแกน QR Code นักเรียน</h2>
    <p>นำ QR Code ของนักเรียนมาไว้ในกรอบ</p>

    <div id="reader"></div>

    <button id="startBtn" onclick="startCamera()" style="display:none">
      📷 แตะเพื่อเริ่มกล้อง
    </button>

    <p id="status">กำลังเตรียมกล้อง...</p>
  </div>

<script>
  let scanner = null;
  let running = false;
  let processing = false;
  let stopRequested = false;

  const statusText = document.getElementById('status');
  const startBtn = document.getElementById('startBtn');

  async function startCamera() {
    if (running || processing) return;

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      statusText.textContent =
        'เบราว์เซอร์ไม่รองรับกล้อง กรุณาเปิดผ่าน HTTPS';
      startBtn.style.display = 'block';
      return;
    }

    processing = true;
    stopRequested = false;
    startBtn.disabled = true;
    statusText.textContent = 'กำลังขออนุญาตใช้กล้อง...';

    try {
      if (!scanner) {
        scanner = new Html5Qrcode('reader');
      }

      await scanner.start(
        { facingMode: 'environment' },
        {
          fps: 10,
          aspectRatio: 1,
          qrbox: function(width, height) {
            const size = Math.floor(
              Math.min(width, height) * 0.72
            );
            return { width: size, height: size };
          }
        },

        async function(decodedText) {
          if (!running || processing) return;

          processing = true;
          running = false;

          statusText.textContent =
            'อ่าน QR สำเร็จ กำลังส่งข้อมูล...';

          try {
            await scanner.stop();
          } catch (e) {}

          // ส่งรหัส QR กลับไปยัง Google Apps Script
          window.parent.postMessage({
            type: 'QR_SCANNED',
            code: decodedText
          }, '*');

          statusText.textContent =
            'ส่งรหัสแล้ว กำลังบันทึกการเข้าเรียน...';

          startBtn.style.display = 'none';
          processing = false;
        },

        function() {}
      );

      running = true;

      if (stopRequested) {
        await stopCamera();
        return;
      }

      statusText.textContent =
        'เปิดกล้องแล้ว กรุณาสแกน QR Code';

      startBtn.style.display = 'none';

    } catch (error) {
      console.error(error);

      statusText.textContent =
        'เปิดกล้องอัตโนมัติไม่สำเร็จ กรุณากดปุ่มเริ่มกล้องและอนุญาตการใช้กล้อง';

      startBtn.style.display = 'block';

    } finally {
      processing = false;
      startBtn.disabled = false;
    }
  }

  async function stopCamera() {
    stopRequested = true;

    if (scanner && running) {
      try {
        await scanner.stop();
      } catch (e) {}
    }

    running = false;

    statusText.textContent = 'หยุดกล้องชั่วคราว';
    startBtn.style.display = 'none';
  }

  // รับคำสั่งจากหน้า Google Apps Script
  window.addEventListener('message', function(event) {
    if (event.data && event.data.type === 'START_CAMERA') {
      startCamera();
    }

    if (event.data && event.data.type === 'STOP_CAMERA') {
      stopCamera();
    }
  });

  // พยายามเปิดกล้องอัตโนมัติเมื่อ iframe โหลดเสร็จ
  window.addEventListener('load', function() {
    startCamera();
  });
</script>
</body>
</html>
